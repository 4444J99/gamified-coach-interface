name: Python document-analysis regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/analyze_docs.py'
      - 'scripts/tests/test_analyze_docs.py'
      - 'requirements.txt'
      - '.github/workflows/python-document-analysis.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/analyze_docs.py'
      - 'scripts/tests/test_analyze_docs.py'
      - 'requirements.txt'
      - '.github/workflows/python-document-analysis.yml'

permissions:
  contents: read

jobs:
  document-analyzer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile analyzer and regression tests
        run: python -m py_compile scripts/analyze_docs.py scripts/tests/test_analyze_docs.py

      - name: Run document-analysis regression suite
        run: python -m unittest discover -s scripts/tests -p 'test_analyze_docs.py' -v
